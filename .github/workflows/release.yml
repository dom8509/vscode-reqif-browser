name: Release

on:
  push:
    tags:
      - "*"
  # Or by hand (Actions → Release → Run workflow): the release creates its tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0 (the tag is v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Take the version from the tag (v1.2.3 -> 1.2.3) so the .vsix matches it.
      - name: Set version from tag
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Typecheck, test, build
        run: npm run check

      - name: Package .vsix
        run: npx vsce package --out "vscode-reqif-tools-${TAG}.vsix"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "vscode-reqif-tools-${TAG}.vsix" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
